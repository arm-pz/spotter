<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512">
  <!-- Spotter brand mark: spotter's hands supporting a bar overhead.
       Brass (#C9A15E) on warm-black ground (#0b0806). Geometric, legible at 48px.
       Generate platform icons + splash via `npx @capacitor/assets generate` — docs/MOBILE.md. -->
  <rect width="512" height="512" fill="#0b0806"/>
  <!-- Barbell: horizontal bar with weight plates -->
  <g fill="#C9A15E">
    <!-- Main bar -->
    <rect x="64" y="238" width="384" height="36" rx="4"/>
    <!-- Left plate (outer) -->
    <rect x="48" y="202" width="28" height="108" rx="3"/>
    <!-- Left plate (inner) -->
    <rect x="84" y="214" width="20" height="84" rx="2"/>
    <!-- Right plate (inner) -->
    <rect x="408" y="214" width="20" height="84" rx="2"/>
    <!-- Right plate (outer) -->
    <rect x="436" y="202" width="28" height="108" rx="3"/>
    <!-- Spotter's hands: two upward-supporting shapes beneath the bar -->
    <!-- Left hand -->
    <path d="M 180 292 L 180 340 Q 180 352 192 352 L 212 352 Q 224 352 224 340 L 224 292 Z"/>
    <!-- Right hand -->
    <path d="M 288 292 L 288 340 Q 288 352 300 352 L 320 352 Q 332 352 332 340 L 332 292 Z"/>
  </g>
</svg>
