<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spotter home, dark</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F4EFE4}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #082E26; color: #F4EFE4; font-family: Archivo, system-ui, sans-serif; overflow: hidden; display: flex; flex-direction: column">
  <div style="padding: 28px 20px 0; display: flex; flex-direction: column; gap: 16px; flex-grow: 1">
    <div style="display: flex; justify-content: space-between; align-items: flex-end">
      <div>
        <h1 style="margin: 0; font-size: 46px; line-height: 1; font-weight: 700; font-stretch: 70%">Spotter</h1>
        <div style="font-size: 15px; margin-top: 6px; color: #B9CFC6">Sunday 15 November</div>
      </div>
      <button aria-label="Settings" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #2A6656; background: #0E4F40; color: #F4EFE4; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"></path></svg>
      </button>
    </div>

    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; text-align: center">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><span style="font-size: 12px; color: #B9CFC6">Mo</span><span style="font-size: 22px; font-weight: 700; font-stretch: 75%; height: 36px; line-height: 36px">9</span><span style="width: 6px; height: 6px; border-radius: 50%; background: #F4EFE4"></span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><span style="font-size: 12px; color: #B9CFC6">Tu</span><span style="font-size: 22px; font-weight: 700; font-stretch: 75%; height: 36px; line-height: 36px">10</span><span style="width: 6px; height: 6px"></span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><span style="font-size: 12px; color: #B9CFC6">We</span><span style="font-size: 22px; font-weight: 700; font-stretch: 75%; height: 36px; line-height: 36px">11</span><span style="width: 6px; height: 6px; border-radius: 50%; background: #F4EFE4"></span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><span style="font-size: 12px; color: #B9CFC6">Th</span><span style="font-size: 22px; font-weight: 700; font-stretch: 75%; height: 36px; line-height: 36px">12</span><span style="width: 6px; height: 6px"></span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><span style="font-size: 12px; color: #B9CFC6">Fr</span><span style="font-size: 22px; font-weight: 700; font-stretch: 75%; height: 36px; line-height: 36px">13</span><span style="width: 6px; height: 6px; border-radius: 50%; background: #F4EFE4"></span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><span style="font-size: 12px; color: #B9CFC6">Sa</span><span style="font-size: 22px; font-weight: 700; font-stretch: 75%; height: 36px; line-height: 36px">14</span><span style="width: 6px; height: 6px"></span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><span style="font-size: 12px; font-weight: 600">Su</span><span style="font-size: 22px; font-weight: 700; font-stretch: 75%; width: 36px; height: 36px; line-height: 36px; border-radius: 10px; background: #F4EFE4; color: #0E4F40">15</span><span style="width: 6px; height: 6px; border-radius: 50%; background: #FF3A24"></span></div>
    </div>

    <div style="background: #F4EFE4; color: #0E4F40; border-radius: 22px; padding: 22px 20px 20px; display: flex; flex-direction: column; gap: 18px">
      <div>
        <div style="font-size: 14px; color: #3F6A5E">Today</div>
        <h2 style="margin: 4px 0 0; font-size: 44px; line-height: 0.98; font-weight: 700; font-stretch: 68%">Push Day</h2>
        <div style="font-size: 15px; color: #3F6A5E; margin-top: 8px">6 exercises, 19 sets. Bench press goes up 2.5 kg.</div>
      </div>
      <div style="display: flex; gap: 10px; align-items: center">
        <button style="flex-grow: 1; height: 50px; border-radius: 14px; border: 0; background: #0E4F40; color: #F4EFE4; font-family: inherit; font-size: 18px; font-weight: 700">Start workout</button>
        <button style="height: 50px; padding: 0 16px; border-radius: 14px; border: 1px solid #7E9F94; background: transparent; color: #0E4F40; font-family: inherit; font-size: 15px; font-weight: 500">Change</button>
      </div>
    </div>

    <div style="background: #0E4F40; border: 1px solid #2A6656; border-radius: 22px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <span style="font-size: 14px; color: #B9CFC6">Body weight</span>
        <button style="height: 44px; margin: -10px -8px -10px 0; padding: 0 8px; border: 0; background: transparent; color: #F4EFE4; font-family: inherit; font-size: 15px; font-weight: 600">Log weight</button>
      </div>
      <div style="display: flex; align-items: baseline; gap: 8px">
        <span style="font-size: 52px; line-height: 1; font-weight: 700; font-stretch: 68%">78.4</span>
        <span style="font-size: 16px; color: #B9CFC6">kg</span>
        <span style="font-size: 14px; color: #B9CFC6; margin-left: auto">1.4 kg above your 77 kg goal</span>
      </div>
      <svg role="img" aria-label="Body weight falling from 82 to 78.4 kg since September" width="100%" height="84" viewBox="0 0 310 84" preserveAspectRatio="none" fill="none">
        <path d="M0 14 L28 10 L52 20 L84 18 L112 30 L140 34 L170 44 L196 42 L226 52 L254 56 L282 58 L310 66 L310 84 L0 84 Z" fill="#F4EFE4" opacity=".10"></path>
        <path d="M0 14 L28 10 L52 20 L84 18 L112 30 L140 34 L170 44 L196 42 L226 52 L254 56 L282 58 L310 66" stroke="#F4EFE4" stroke-width="2.5" stroke-linejoin="round"></path>
        <path d="M0 76 H310" stroke="#B9CFC6" stroke-width="1.5" stroke-dasharray="5 5"></path>
        <circle cx="306" cy="66" r="4.5" fill="#FF3A24"></circle>
      </svg>
    </div>
  </div>

  <nav aria-label="Main" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: end; padding: 8px 8px 18px; background: #0B3B30; border-top: 1px solid #2A6656">
    <button style="border: 0; background: transparent; color: #F4EFE4; font-family: inherit; font-size: 12px; font-weight: 700; height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 11 12 4l8 7v9H4z"></path></svg>Home</button>
    <button style="border: 0; background: transparent; color: #B9CFC6; font-family: inherit; font-size: 12px; height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="3"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg>Plan</button>
    <button aria-label="Start workout" style="border: 0; background: transparent; padding: 0; display: flex; justify-content: center; height: 52px"><span style="width: 64px; height: 64px; margin-top: -22px; border-radius: 50%; background: #FF3A24; color: #062019; box-shadow: 0 0 0 5px #0B3B30; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg></span></button>
    <button style="border: 0; background: transparent; color: #B9CFC6; font-family: inherit; font-size: 12px; height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6 20v-6M12 20V5M18 20v-9"></path></svg>Stats</button>
    <button style="border: 0; background: transparent; color: #B9CFC6; font-family: inherit; font-size: 12px; height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 12h18M6 8v8M18 8v8M9 6v12M15 6v12"></path></svg>Exercises</button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
