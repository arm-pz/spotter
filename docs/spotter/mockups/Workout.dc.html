<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spotter workout</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E4F40}a:hover{color:#062019}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4EFE4; color: #0E4F40; font-family: Archivo, system-ui, sans-serif; overflow: hidden; display: flex; flex-direction: column">
  <div style="padding: 20px 20px 0; display: flex; flex-direction: column; gap: 14px; flex-grow: 1">
    <div style="display: flex; align-items: center; gap: 12px">
      <button aria-label="Minimise workout" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #C9D2C6; background: #FBF8F1; color: #0E4F40; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg></button>
      <div style="flex-grow: 1">
        <div style="font-size: 22px; font-weight: 700; font-stretch: 72%; line-height: 1.05">Push Day</div>
        <div style="font-size: 14px; color: #3F6A5E">18:42 elapsed, 2 of 19 sets</div>
      </div>
      <button style="height: 44px; padding: 0 16px; border-radius: 12px; border: 1.5px solid #0E4F40; background: transparent; color: #0E4F40; font-family: inherit; font-size: 15px; font-weight: 700">Finish</button>
    </div>
    <div role="img" aria-label="2 of 19 sets done" style="height: 6px; border-radius: 3px; background: #DAD9CB; overflow: hidden"><div style="width: 11%; height: 100%; background: #0E4F40"></div></div>

    <div>
      <h1 style="margin: 4px 0 0; font-size: 40px; line-height: 0.98; font-weight: 700; font-stretch: 68%">Barbell Bench Press</h1>
      <div style="font-size: 15px; color: #3F6A5E; margin-top: 8px; line-height: 1.4">Last time 75 kg for 8, 8, 8, 8. You hit every rep, so today is 77.5 kg.</div>
      <div style="display: flex; gap: 6px; margin-top: 10px">
        <span style="font-size: 13px; padding: 4px 10px; border-radius: 8px; background: #E6E6D9; color: #0E4F40">Pectorals</span>
        <span style="font-size: 13px; padding: 4px 10px; border-radius: 8px; background: #E6E6D9; color: #0E4F40">Barbell</span>
        <span style="font-size: 13px; padding: 4px 10px; border-radius: 8px; background: #E6E6D9; color: #0E4F40">25 + 2.5 + 1.25 per side</span>
      </div>
    </div>

    <div style="background: #FBF8F1; border: 1px solid #DAD9CB; border-radius: 22px; padding: 14px 14px 8px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: grid; grid-template-columns: 32px 1fr 1fr 48px; gap: 10px; font-size: 13px; color: #3F6A5E; text-align: center"><span>Set</span><span>Weight, kg</span><span>Reps</span><span>Done</span></div>

      <div style="display: grid; grid-template-columns: 32px 1fr 1fr 48px; gap: 10px; align-items: center; text-align: center">
        <span style="font-size: 16px; font-weight: 700; color: #3F6A5E">1</span>
        <span style="height: 48px; line-height: 48px; border-radius: 12px; background: #E6E6D9; font-size: 24px; font-weight: 700; font-stretch: 75%">77.5</span>
        <span style="height: 48px; line-height: 48px; border-radius: 12px; background: #E6E6D9; font-size: 24px; font-weight: 700; font-stretch: 75%">8</span>
        <button aria-label="Set 1 done, undo" style="width: 48px; height: 48px; border-radius: 50%; border: 0; background: #0E4F40; color: #F4EFE4; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"></path></svg></button>
      </div>
      <div style="display: grid; grid-template-columns: 32px 1fr 1fr 48px; gap: 10px; align-items: center; text-align: center">
        <span style="font-size: 16px; font-weight: 700; color: #3F6A5E">2</span>
        <span style="height: 48px; line-height: 48px; border-radius: 12px; background: #E6E6D9; font-size: 24px; font-weight: 700; font-stretch: 75%">77.5</span>
        <span style="height: 48px; line-height: 48px; border-radius: 12px; background: #E6E6D9; font-size: 24px; font-weight: 700; font-stretch: 75%">8</span>
        <button aria-label="Set 2 done, undo" style="width: 48px; height: 48px; border-radius: 50%; border: 0; background: #0E4F40; color: #F4EFE4; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"></path></svg></button>
      </div>
      <div style="display: grid; grid-template-columns: 32px 1fr 1fr 48px; gap: 10px; align-items: center; text-align: center; margin: 2px -6px; padding: 6px; border-radius: 16px; border: 1.5px solid #0E4F40">
        <span style="font-size: 16px; font-weight: 700">3</span>
        <button aria-label="Weight 77.5 kg, change" style="height: 52px; border-radius: 12px; border: 0; background: #F4EFE4; color: #0E4F40; font-family: inherit; font-size: 28px; font-weight: 700; font-stretch: 75%">77.5</button>
        <button aria-label="8 reps, change" style="height: 52px; border-radius: 12px; border: 0; background: #F4EFE4; color: #0E4F40; font-family: inherit; font-size: 28px; font-weight: 700; font-stretch: 75%">8</button>
        <button aria-label="Mark set 3 done" style="width: 48px; height: 48px; border-radius: 50%; border: 0; background: #FF3A24; color: #062019; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"></path></svg></button>
      </div>
      <div style="display: grid; grid-template-columns: 32px 1fr 1fr 48px; gap: 10px; align-items: center; text-align: center">
        <span style="font-size: 16px; font-weight: 700; color: #3F6A5E">4</span>
        <span style="height: 48px; line-height: 48px; border-radius: 12px; border: 1px solid #DAD9CB; font-size: 24px; font-weight: 700; font-stretch: 75%; color: #3F6A5E">77.5</span>
        <span style="height: 48px; line-height: 48px; border-radius: 12px; border: 1px solid #DAD9CB; font-size: 24px; font-weight: 700; font-stretch: 75%; color: #3F6A5E">8</span>
        <span aria-hidden="true" style="width: 44px; height: 44px; margin: 2px; border-radius: 50%; border: 1.5px solid #C9D2C6; box-sizing: border-box"></span>
      </div>
      <button style="height: 44px; border: 0; background: transparent; color: #0E4F40; font-family: inherit; font-size: 15px; font-weight: 600">Add a set</button>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center">
      <button style="height: 44px; padding: 0 4px; border: 0; background: transparent; color: #3F6A5E; font-family: inherit; font-size: 15px">Previous</button>
      <span style="font-size: 14px; color: #3F6A5E">Exercise 1 of 6</span>
      <button style="height: 44px; padding: 0 4px; border: 0; background: transparent; color: #0E4F40; font-family: inherit; font-size: 15px; font-weight: 700">Next: Incline press</button>
    </div>
  </div>

  <div style="margin: 0 12px 16px; background: #0E4F40; color: #F4EFE4; border-radius: 22px; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 12px">
      <div style="flex-grow: 1">
        <div style="font-size: 14px; color: #B9CFC6">Rest</div>
        <div style="font-size: 48px; line-height: 1; font-weight: 700; font-stretch: 68%">1:12</div>
      </div>
      <button style="height: 48px; padding: 0 14px; border-radius: 14px; border: 1px solid #5E8A7D; background: transparent; color: #F4EFE4; font-family: inherit; font-size: 15px">Add 15 s</button>
      <button style="height: 48px; padding: 0 18px; border-radius: 14px; border: 0; background: #F4EFE4; color: #0E4F40; font-family: inherit; font-size: 16px; font-weight: 700">Skip rest</button>
    </div>
    <div role="img" aria-label="72 of 90 seconds left" style="height: 5px; border-radius: 3px; background: #2A6656; overflow: hidden"><div style="width: 80%; height: 100%; background: #FF3A24"></div></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
